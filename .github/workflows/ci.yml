name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  # ---------------------------------------------------------------
  # Pruebas del backend Python (sin dependencias pesadas: los modelos
  # de embeddings y el cliente de Weaviate se importan de forma diferida)
  # ---------------------------------------------------------------
  backend:
    name: Pruebas del backend Python
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Instalar dependencias de prueba
        # Ligeras: los modelos de embeddings (sentence-transformers/torch) y
        # GLiNER se importan de forma diferida, así que no hacen falta aquí.
        # weaviate-client sí es necesario porque build_filter() lo importa.
        run: pip install pytest fastapi pydantic httpx weaviate-client
      - name: Ejecutar pruebas
        run: python -m pytest -q tests

  # ---------------------------------------------------------------
  # Pruebas del modo nativo de Vercel (funciones serverless en JS),
  # verificación del bundle y build del frontend
  # ---------------------------------------------------------------
  web:
    name: Frontend y funciones de Vercel
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Instalar dependencias
        run: npm ci
      - name: Pruebas de las funciones serverless
        run: npm test
      - name: Verificar que el corpus entra en el bundle
        run: npm run trace
      - name: Compilar el frontend
        run: npm run build
      - name: Comprobar que el build existe
        run: test -f dist/index.html
